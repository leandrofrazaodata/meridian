# DAB bundle root. See docs/deployment-strategy.md for the design this
# implements — why DAB owns only the Job + Pipelines, not schemas.
bundle:
  name: meridian

include:
  - resources/*.yml

sync:
  # transformations/ lives one level above this bundle's root (deploy/).
  # sync.paths entries may point outside the bundle root — that's what's
  # needed to get both Lakeflow pipelines' source directories uploaded on
  # `bundle deploy` (see resources/pipelines.yml's two libraries.glob.include
  # entries, which resolve relative to this bundle's root).
  paths:
    - .
    - ../transformations

variables:
  schema_prefix:
    description: >-
      Prefix for the three medallion schemas (bronze/silver/gold). Every
      bundle resource and both deploy/scripts/*.py scripts read this same
      variable/default rather than hardcoding the name a second time —
      see docs/deployment-strategy.md "Schema prefix". Matches the names
      already used throughout contracts/*.yml and docs/conventions.md.
    default: meridian
  warehouse_id:
    description: >-
      Serverless SQL warehouse ID the Job's COPY INTO tasks run against
      (docs/pipeline-architecture.md "Platform constraints" — serverless-
      only compute, no clusters). No default: every workspace has a
      different warehouse ID. Find yours with `databricks warehouses
      list`, then supply it with --var="warehouse_id=<id>" at deploy
      time, or add it under targets.dev.variables below once known.
  service_principal_id:
    description: >-
      Application ID of the service principal every Job/Pipeline runs as,
      and the only identity that deploys this bundle (locally via the
      `meridian-sp` CLI profile, and in CI). An identifier, not a
      credential. See docs/deployment-strategy.md "Identity".
    default: d2a8bef0-ed6e-4a46-9dd1-84a527c9eade

targets:
  dev:
    mode: development
    default: true
    # No workspace.host here deliberately: auth comes from the local
    # `meridian-sp` Databricks CLI profile (OAuth M2M as the service
    # principal -- pass `--profile meridian-sp`), or from DATABRICKS_*
    # env vars in CI. Per docs/deployment-strategy.md's Platform
    # constraints, Free Edition CLI auth only reliably works from a local
    # machine or CI, not from inside the workspace UI.
    # Job and both pipelines always execute as the service principal,
    # even if a human ever deploys by mistake -- docs/deployment-strategy.md
    # "Identity".
    run_as:
      service_principal_name: ${var.service_principal_id}
