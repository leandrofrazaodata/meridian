# Reusable workflow: pytest (deploy/scripts) + a read-only bundle
# validate. Called by pr-checks.yml on every PR; kept as a separate
# reusable file so the required status check keeps its name,
# `test / test`. See docs/superpowers/specs/2026-09-25-cicd-design.md
# for the design.
name: Run tests

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install -r deploy/scripts/requirements.txt

      - name: Run pytest
        working-directory: deploy/scripts
        run: pytest -v

      - uses: databricks/setup-cli@main

      - name: Validate bundle
        working-directory: deploy
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          # OAuth M2M as the meridian-pipeline-runner service principal --
          # see docs/deployment-strategy.md "Identity".
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: databricks bundle validate -t dev --var="warehouse_id=${{ vars.DATABRICKS_WAREHOUSE_ID }}"
