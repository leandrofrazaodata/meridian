# Gates pull requests targeting main with the reusable test workflow.
# Branch protection on main requires this check (`test / test`) to pass
# on an up-to-date branch -- it's the only test gate before deploy (see
# docs/superpowers/specs/2026-09-25-cicd-design.md "Trigger model").
name: PR checks

on:
  pull_request:
    branches: [main]

jobs:
  test:
    uses: ./.github/workflows/run-tests.yml
    secrets: inherit
