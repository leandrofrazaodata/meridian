# Redeploys the Job + both Pipelines on merge to main, when
# deploy-relevant files changed. No test job here: branch protection on
# main requires the PR check (`test / test`) to pass on an up-to-date
# branch, so the merged commit is the one that was tested -- and
# `bundle deploy` validates the bundle itself before changing anything.
# See docs/superpowers/specs/2026-09-25-cicd-design.md "Trigger model".
# Never runs the data pipelines themselves (no `databricks bundle run`
# anywhere in this file).
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'deploy/**'
      - 'transformations/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: databricks/setup-cli@main

      - name: Deploy bundle
        working-directory: deploy
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          # OAuth M2M as the meridian-pipeline-runner service principal --
          # see docs/deployment-strategy.md "Identity".
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: databricks bundle deploy -t dev --var="warehouse_id=${{ vars.DATABRICKS_WAREHOUSE_ID }}"
