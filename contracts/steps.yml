name: steps
description: Per-minute step-count records from the wristband.
grain: one row per participant per minute
owner: Leandro Frazão

source:
  format: json
  path: /Volumes/workspace/default/raw/data/wearable_events/*/steps.json
  read_options:
    multiLine: true

bronze:
  table: meridian_bronze.steps
  load_pattern: copy_into

natural_key: [participant_id, timestamp]

schema:
  - name: timestamp
    type: timestamp
    nullable: false
    description: Minute-boundary, whole-minute (seconds = 00)
  - name: steps
    type: int
    nullable: false
  - name: participant_id
    type: string
    nullable: false
  - name: _unit
    type: string
    nullable: true
    description: >-
      Source-supplied unit tag. Absent (NULL) = steps per minute;
      'steps_per_hour' = steps per hour (P005, P033, P038). Silver converts
      to per-minute and keeps the original value in _steps_source.

quality:
  - id: steps_non_negative
    rule: steps >= 0
    on_fail: flag
  - id: steps_plausible
    rule: steps <= 250
    on_fail: flag
    note: >-
      Expected range is 0-30/min at rest-to-moderate activity; 250 is a hard
      ceiling, not the expected max. Evaluated after per-hour values are
      converted to per-minute. Gold excludes flagged minutes from total_steps.
  - id: ts_not_null
    rule: timestamp IS NOT NULL
    on_fail: fail
  - id: pid_matches_path
    rule: participant_id = _pid_from_path
    on_fail: flag
  - id: unit_known
    rule: _unit IS NULL OR _unit = 'steps_per_hour'
    on_fail: flag
    note: An unrecognized unit is left unconverted, so its value can't be trusted.

freshness:
  cadence: static
  notes: Fixed 28-day dataset today; would be daily in a live deployment.
